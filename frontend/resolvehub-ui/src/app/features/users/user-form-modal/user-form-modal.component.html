<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div>
        <h3 class="modal-title">{{ isEditMode ? 'Edit User' : 'Create New User' }}</h3>
      </div>
      <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close modal">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 5l10 10M15 5L5 15"/>
        </svg>
      </button>
    </div>

    <!-- Error Alert -->
    @if (errorMessage) {
      <div class="error-alert">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <!-- Form Content -->
    <form (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-row">
        <!-- Full Name -->
        <div class="form-group flex-1">
          <label for="fullName" class="form-label">Full Name <span class="required">*</span></label>
          <input
            type="text"
            id="fullName"
            class="form-input"
            [(ngModel)]="formData.fullName"
            name="fullName"
            placeholder="e.g. Alex Morgan"
            required
          />
        </div>

        <!-- Username -->
        <div class="form-group flex-1">
          <label for="userName" class="form-label">Username</label>
          <input
            type="text"
            id="userName"
            class="form-input"
            [(ngModel)]="formData.userName"
            name="userName"
            placeholder="Auto-generated if blank"
          />
        </div>
      </div>

      <div class="form-row">
        <!-- Email -->
        <div class="form-group flex-1">
          <label for="email" class="form-label">Email Address <span class="required">*</span></label>
          <input
            type="email"
            id="email"
            class="form-input"
            [(ngModel)]="formData.email"
            name="email"
            placeholder="user@resolvehub.com"
            required
          />
        </div>

        <!-- Phone -->
        <div class="form-group flex-1">
          <label for="phone" class="form-label">Phone</label>
          <input
            type="text"
            id="phone"
            class="form-input"
            [(ngModel)]="formData.phone"
            name="phone"
            placeholder="+1 (555) 000-0000"
          />
        </div>
      </div>

      <!-- Password (Create only) -->
      @if (!isEditMode) {
        <div class="form-group">
          <label for="password" class="form-label">Initial Password <span class="required">*</span></label>
          <input
            type="password"
            id="password"
            class="form-input"
            [(ngModel)]="formData.password"
            name="password"
            placeholder="Minimum 6 characters"
            required
          />
        </div>
      }

      <div class="form-row">
        <!-- Role Dropdown -->
        <div class="form-group flex-1">
          <label for="roleCode" class="form-label">Role <span class="required">*</span></label>
          <select
            id="roleCode"
            class="form-select"
            [(ngModel)]="formData.roleCode"
            name="roleCode"
            required
          >
            <option value="ADMIN">ADMIN (Full System Access)</option>
            <option value="AGENT">AGENT (Service Desk Staff)</option>
            <option value="USER">USER (Requester)</option>
          </select>
        </div>

        <!-- Department Dropdown -->
        <div class="form-group flex-1">
          <label for="departmentGId" class="form-label">Department</label>
          <select
            id="departmentGId"
            class="form-select"
            [(ngModel)]="formData.departmentGId"
            name="departmentGId"
          >
            <option value="">No Department Assigned</option>
            @for (dept of departments; track dept.gId) {
              <option [value]="dept.gId">{{ dept.departmentName }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Active Checkbox -->
      <div class="form-group-checkbox">
        <label class="checkbox-label">
          <input
            type="checkbox"
            class="checkbox-input"
            [(ngModel)]="formData.isActive"
            name="isActive"
          />
          <span class="checkbox-text">Active Account</span>
        </label>
      </div>

      <!-- Actions -->
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isSaving">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving">
          @if (isSaving) {
            <span class="spinner-sm"></span>
            <span>Saving...</span>
          } @else {
            <span>{{ isEditMode ? 'Update User' : 'Create User' }}</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
