<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </div>
      <div>
        <h3 class="modal-title">{{ isEditMode ? 'Edit Category' : 'Create New Category' }}</h3>
        <p class="modal-subtitle">Group related requests and services under a department</p>
      </div>
      <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close modal">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 5l10 10M15 5L5 15"/>
        </svg>
      </button>
    </div>

    <!-- Error Alert -->
    @if (errorMessage) {
      <div class="error-alert">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <!-- Form Content -->
    <form (ngSubmit)="onSubmit()" class="modal-form">
      <!-- Department Dropdown -->
      <div class="form-group">
        <label for="departmentGId" class="form-label">
          Department <span class="required">*</span>
        </label>
        <select
          id="departmentGId"
          class="form-select"
          [(ngModel)]="formData.departmentGId"
          name="departmentGId"
          required
        >
          <option value="" disabled>Select a department</option>
          @for (dept of departments; track dept.gId) {
            <option [value]="dept.gId">{{ dept.departmentName }}</option>
          }
        </select>
      </div>

      <!-- Category Name -->
      <div class="form-group">
        <label for="categoryName" class="form-label">
          Category Name <span class="required">*</span>
        </label>
        <input
          type="text"
          id="categoryName"
          class="form-input"
          [(ngModel)]="formData.categoryName"
          name="categoryName"
          placeholder="e.g. Network & Infrastructure, Payroll & Benefits"
          maxlength="100"
          required
        />
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description" class="form-label">Description</label>
        <textarea
          id="description"
          class="form-textarea"
          rows="3"
          [(ngModel)]="formData.description"
          name="description"
          placeholder="Optional brief description of this category..."
          maxlength="250"
        ></textarea>
      </div>

      <!-- Active Status Checkbox -->
      <div class="form-group-checkbox">
        <label class="checkbox-label">
          <input
            type="checkbox"
            class="checkbox-input"
            [(ngModel)]="formData.isActive"
            name="isActive"
          />
          <span class="checkbox-text">Active Category (available for selection on tickets)</span>
        </label>
      </div>

      <!-- Actions -->
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isSaving">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving">
          @if (isSaving) {
            <span class="spinner-sm"></span>
            <span>Saving...</span>
          } @else {
            <span>{{ isEditMode ? 'Update Category' : 'Create Category' }}</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
